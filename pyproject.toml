[project]
name = "genai-langchain-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.3.6",
    "fastapi>=0.124.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "langchain>=1.1.3",
    "langchain-chroma>=1.0.0",
    "langchain-openai>=1.1.2",
    "langchain-text-splitters>=1.0.0",
    "loguru>=0.7.3",
    "openai>=2.11.0",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.4.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = ["black>=25.11.0"]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false
